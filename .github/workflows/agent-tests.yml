name: Agent safety tests

# Runs both agent engines against the scenarios and the red-flag safety set
# whenever the agent or its playbook changes. A pull request can't be merged
# safely while this is red.
on:
  push:
    branches: [main]
    paths: ["agent/**", ".github/workflows/agent-tests.yml"]
  pull_request:
    paths: ["agent/**", ".github/workflows/agent-tests.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: JavaScript engine
        run: node agent/test.mjs
      - name: Python engine
        run: python3 agent/test_agent.py
